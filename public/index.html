<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>303-XMD — Multi-User Web Pairing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#00ff88;--bg:#0a0a0c;--card:rgba(25,25,30,.6);--border:rgba(255,255,255,.1);--text:#fff;--muted:#8b8b93}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
         background-image:radial-gradient(circle at 15% 50%,rgba(0,255,136,.08) 0,transparent 50%),
                          radial-gradient(circle at 85% 30%,rgba(0,150,255,.08) 0,transparent 50%);
         overflow:hidden;padding:16px}
    .glass-panel{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
                 border:1px solid var(--border);border-radius:24px;padding:40px;width:100%;max-width:420px;
                 box-shadow:0 25px 50px -12px rgba(0,0,0,.5);text-align:center;position:relative;z-index:10}
    .logo{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:8px;
          background:linear-gradient(90deg,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:8px}
    .notice{color:var(--muted);font-size:12px;margin-bottom:24px;padding:8px 12px;border-radius:8px;
            background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15)}
    .input-group{margin-bottom:20px;text-align:left}
    .input-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;
                       margin-left:4px;text-transform:uppercase;letter-spacing:1px}
    .input-group input{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:12px;
                       padding:16px;color:var(--text);font-size:16px;outline:none;transition:all .3s}
    .input-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,255,136,.1)}
    button{width:100%;padding:16px;border-radius:12px;border:none;background:var(--primary);color:#000;
           font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;
           justify-content:center;gap:10px}
    button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px -10px var(--primary)}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    button.secondary{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:12px;font-size:14px;padding:12px}
    #result-area{display:none;margin-top:24px;padding-top:24px;border-top:1px solid var(--border);animation:fadeIn .5s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .code-box{background:rgba(0,255,136,.1);border:1px dashed var(--primary);border-radius:12px;padding:20px;margin-bottom:16px}
    .code-box p{color:var(--muted);font-size:13px;margin-bottom:8px}
    .code{font-size:32px;font-weight:800;letter-spacing:4px;color:var(--primary);user-select:all;word-break:break-all}
    .status-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;
                  font-size:13px;font-weight:600;background:rgba(255,255,255,.05);color:var(--muted)}
    .status-badge.connected{background:rgba(0,255,136,.15);color:var(--primary)}
    .status-badge.expired{background:rgba(255,74,74,.15);color:#ff4a4a}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .status-badge.connected .dot{background:var(--primary);box-shadow:0 0 10px var(--primary);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,255,136,.4)}70%{box-shadow:0 0 0 10px rgba(0,255,136,0)}100%{box-shadow:0 0 0 0 rgba(0,255,136,0)}}
    .loader{display:none;width:20px;height:20px;border:3px solid rgba(0,0,0,.3);border-radius:50%;
            border-top-color:#000;animation:spin 1s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{color:#ff4a4a;font-size:14px;margin-top:12px;display:none}
    .footer{margin-top:30px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="glass-panel">
    <div class="logo">303-XMD</div>
    <div class="subtitle">THE LAST KEY — Multi-User Web Pairing</div>
    <div class="notice">🔒 This session belongs only to the number you pair. Each user gets their own.</div>

    <div class="input-group">
      <label for="phone">WhatsApp Number (with country code)</label>
      <input type="tel" id="phone" placeholder="e.g. 254794376595"
             autocomplete="off" inputmode="numeric" pattern="[0-9]*" maxlength="15">
    </div>

    <button id="pair-btn" type="button">
      <span id="btn-text">Generate Pairing Code</span>
      <div class="loader" id="btn-loader"></div>
    </button>
    <button id="clear-btn" type="button" class="secondary" style="display:none">Clear this session</button>

    <div class="error-msg" id="error-msg" role="alert" aria-live="assertive"></div>

    <div id="result-area">
      <div class="code-box">
        <p>Enter this code on your WhatsApp:</p>
        <div class="code" id="pairing-code">----</div>
      </div>
      <div class="status-badge" id="status-badge">
        <div class="dot"></div>
        <span id="status-text" aria-live="polite">Waiting for connection...</span>
      </div>
    </div>

    <div class="footer">&copy; <span id="year"></span> 303-XMD. Powered by Baileys.</div>
  </div>

  <script>
    'use strict';
    const LS_KEY = '303xmd.session';
    const $ = (id) => document.getElementById(id);

    let pollInterval = null;
    let currentSessionId = null;
    let busy = false;
    let pollGeneration = 0;

    function showError(msg) { const e = $('error-msg'); e.innerText = msg; e.style.display = 'block'; }
    function clearError() { const e = $('error-msg'); e.style.display = 'none'; e.innerText = ''; }
    function setLoading(on) {
      $('pair-btn').disabled = on;
      $('btn-text').style.display = on ? 'none' : 'block';
      $('btn-loader').style.display = on ? 'block' : 'none';
    }
    function resetStatusBadge() {
      const b = $('status-badge'); b.classList.remove('connected', 'expired');
      $('status-text').innerText = 'Waiting for connection...';
    }
    function stopPolling() {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      pollGeneration++;
    }
    async function fetchJson(url, options = {}, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        const text = await res.text();
        let data = null;
        if (text) { try { data = JSON.parse(text); } catch { data = null; } }
        return { res, data };
      } finally { clearTimeout(timer); }
    }

    function saveSession(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} }
    function loadSession() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; } }
    function clearSession() { try { localStorage.removeItem(LS_KEY); } catch {} }

    async function requestCode() {
      if (busy) return;
      busy = true; clearError(); stopPolling();
      $('result-area').style.display = 'none';

      const phone = $('phone').value.replace(/[^0-9]/g, '');
      if (phone.length < 10 || phone.length > 15) { showError('Enter a valid phone number.'); busy = false; return; }
      if (!/^[1-9]\d{9,14}$/.test(phone)) { showError('Invalid phone number format.'); busy = false; return; }

      setLoading(true);
      try {
        const { res, data } = await fetchJson('/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        }, 45000);

        if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
        if (!data || !data.sessionId || !data.code) throw new Error('Invalid server response.');

        currentSessionId = data.sessionId;
        $('pairing-code').innerText = data.code;
        $('result-area').style.display = 'block';
        $('clear-btn').style.display = 'block';
        saveSession({ sessionId: data.sessionId, code: data.code, phone });
        startPolling(data.sessionId);
      } catch (err) {
        if (err.name === 'AbortError') showError('Request timed out. Try again.');
        else showError(err.message || 'Failed to generate code.');
      } finally { setLoading(false); busy = false; }
    }

    function startPolling(sessionId) {
      stopPolling();
      const myGen = ++pollGeneration;
      const badge = $('status-badge');
      let errors = 0;

      pollInterval = setInterval(async () => {
        if (myGen !== pollGeneration) return;
        let res, data;
        try {
          ({ res, data } = await fetchJson(`/status/${encodeURIComponent(sessionId)}`, {}, 10000));
        } catch {
          if (++errors >= 5) { stopPolling(); badge.classList.add('expired'); $('status-text').innerText = 'Lost connection.'; }
          return;
        }
        if (res.status === 404) {
          stopPolling(); badge.classList.add('expired'); badge.classList.remove('connected');
          $('status-text').innerText = 'Session expired — generate a new code.';
          return;
        }
        if (!res.ok || !data) {
          if (++errors >= 5) { stopPolling(); badge.classList.add('expired'); $('status-text').innerText = 'Lost connection.'; }
          return;
        }
        errors = 0;
        if (data.connected) {
          stopPolling(); badge.classList.add('connected'); badge.classList.remove('expired');
          const num = data.jid ? data.jid.split('@')[0].split(':')[0] : null;
          $('status-text').innerText = num ? `Connected as ${num} ✅` : 'Connected successfully! ✅';
        } else if (data.socketReady) {
          $('status-text').innerText = 'Socket ready, waiting for WhatsApp...';
        } else {
          $('status-text').innerText = 'Waiting for connection...';
        }
      }, 3000);
    }

    function clearCurrent() {
      stopPolling(); clearSession();
      currentSessionId = null;
      $('result-area').style.display = 'none';
      $('clear-btn').style.display = 'none';
      $('phone').value = '';
      resetStatusBadge();
      clearError();
    }

    // Wire
    $('pair-btn').addEventListener('click', requestCode);
    $('clear-btn').addEventListener('click', clearCurrent);
    $('phone').addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); requestCode(); } });
    window.addEventListener('beforeunload', () => stopPolling());
    $('year').textContent = new Date().getFullYear();

    // Resume from localStorage
    (function resume() {
      const saved = loadSession();
      if (saved && saved.sessionId && saved.code) {
        currentSessionId = saved.sessionId;
        $('phone').value = saved.phone || '';
        $('pairing-code').innerText = saved.code;
        $('result-area').style.display = 'block';
        $('clear-btn').style.display = 'block';
        startPolling(saved.sessionId);
      }
    })();
  </script>
</body>
</html>
